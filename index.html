<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12362d">
  <meta name="description" content="输气工初级题库网页版，包含背题、模拟考试、错题复习和逐题解析。">
  <title>输气工（初级）备考题库</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2312362d'/%3E%3Cpath d='M17 19h30v8H17zM13 29h38v7H13zM19 38h26v8H19z' fill='%23f2b84b'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <button class="brand" data-view="home" aria-label="返回首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><strong>输气工</strong><small>初级备考题库</small></span>
      </button>
      <nav class="side-nav">
        <button class="nav-item active" data-view="home"><span>⌂</span>学习首页</button>
        <button class="nav-item" data-action="start-practice"><span>▤</span>背题练习</button>
        <button class="nav-item" data-action="open-exam"><span>◷</span>模拟考试</button>
        <button class="nav-item" data-action="review-wrong"><span>↺</span>错题复习</button>
        <button class="nav-item" data-action="open-bank"><span>⌕</span>题库检索</button>
      </nav>
      <div class="sidebar-foot">
        <div class="mini-progress"><span id="sideProgressLabel">已掌握 0 / 936</span><i><b id="sideProgressBar"></b></i></div>
        <button class="text-button" data-action="open-sources">解析依据与说明</button>
      </div>
    </aside>

    <main class="main-content" id="mainContent" tabindex="-1">
      <header class="mobile-header">
        <button class="brand compact" data-view="home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><strong>输气工 · 初级</strong></button>
        <button class="icon-button" data-action="open-search" aria-label="搜索题目">⌕</button>
      </header>
      <div id="viewRoot" class="view-root"></div>
    </main>

    <nav class="bottom-nav" aria-label="移动端主导航">
      <button class="active" data-view="home"><span>⌂</span>首页</button>
      <button data-action="start-practice"><span>▤</span>背题</button>
      <button data-action="open-exam"><span>◷</span>考试</button>
      <button data-action="review-wrong"><span>↺</span>错题</button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
